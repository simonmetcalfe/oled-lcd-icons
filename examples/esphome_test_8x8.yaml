# Minimal ESPHome config for testing the oli_icons component with the 8x8 icons.
# esphome_test_16x16.yaml does the same for the 16x16 icons.
# It pulls main from GitHub on every compile (refresh: always).
# Real projects can pin a release instead, e.g.:
#   external_components:
#     - source: github://simonmetcalfe/oled-lcd-icons@v0.1.0
#       components: [oli_icons]
# Replace the ESP board model and screen/I2C config with your own.

esphome:
  name: oli-test-8x8

esp32:
  board: esp32-s3-devkitc-1
  framework:
    type: esp-idf

logger:

external_components:
  - source:
      type: git
      url: https://github.com/simonmetcalfe/oled-lcd-icons.git
      ref: main
    components: [oli_icons]
    refresh: always

# Required: loads the component so its headers are included in the build.
# Without it, lambdas fail with "'oli' has not been declared".
oli_icons:

i2c:
  sda: GPIO5
  scl: GPIO6
  frequency: 400kHz

display:
  - platform: ssd1306_i2c
    model: "SH1106 128x64"
    address: 0x3C
    lambda: |-
      namespace ic = oli::icons_8x8;
      static uint8_t pct = 0;
      pct = (pct + 5) % 105;
      oli::draw(it, 0, 0, oli::frame(ic::batterySet, oli::levelIndex(pct, ic::batteryLevels)), ic::W, ic::H);
      oli::draw(it, 12, 0, oli::frame(ic::wifiSet, oli::levelIndex(pct, ic::wifiLevels)), ic::W, ic::H);
      oli::draw(it, 24, 0, oli::frame(ic::tankSet, oli::levelIndex(pct, ic::tankLevels)), ic::W, ic::H);
      oli::draw(it, 36, 0, ic::lock, ic::W, ic::H);
      oli::draw(it, 48, 0, ic::bluetooth, ic::W, ic::H);
      oli::draw(it, 60, 0, ic::warning, ic::W, ic::H);
      it.filled_rectangle(0, 16, 30, 12);
      oli::draw(it, 2, 18, ic::home, ic::W, ic::H, COLOR_OFF);
